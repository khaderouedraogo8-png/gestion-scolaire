# Production — PostgreSQL + Backend Gunicorn + Nginx (frontend + API)
#
# Projet Docker isolé (volumes/containers séparés du dev).
#
# Usage :
#   cp deploy/env.prod.example deploy/.env.prod   # puis éditer les secrets
#   docker compose --env-file deploy/.env.prod -f docker-compose.prod.yml up -d --build

name: gestion-prod

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file:
      - deploy/.env.prod
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./database/schema_v2_mono_etablissement.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - deploy/.env.prod
    volumes:
      - uploads_data_prod:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh /app/docker-entrypoint.prod.sh
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/api/health')\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - internal

  nginx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

  # Sauvegarde manuelle : docker compose -f docker-compose.prod.yml run --rm backup
  backup:
    profiles: ["backup"]
    image: postgres:15-alpine
    env_file:
      - deploy/.env.prod
    volumes:
      - ./backups:/backups
      - ./scripts/backup_db.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh", "/backups"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER}
      PGDATABASE: ${POSTGRES_DB}
    networks:
      - internal

volumes:
  postgres_data_prod:
  uploads_data_prod:

networks:
  internal:
    driver: bridge
